baseURL = 'https://amarpandey.me/'
languageCode = 'en-US'
title = "Amar’s space: data, open source & side quests"
theme = 'hugo-bearblog'

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

[params]
  author = "Amar Prakash Pandey"
  Description = "Amar Prakash Pandey, senior data engineer at Citi working on Spark and data platforms. Apache Airflow contributor and former CRI-O and DuckDuckGo maintainer."
  images = ["images/og-card.jpg"]
  hideMadeWithLine = true
  favicon = "favicon/favicon.png"

[params.analytics]
  measurement_id = "G-CN34V0ZGSQ"

[markup]
  [markup.highlight]
    style = "autumn"
    noClasses = false
    codeFences = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]