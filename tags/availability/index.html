  <script>
(function () {
  var root = document.documentElement;
  var button = document.querySelector(".theme-toggle");
  if (!button) return;
  function current() {
    return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function sync() { button.setAttribute("aria-pressed", current() === "dark"); }
  sync();
  button.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    var apply = function () {
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      sync();
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame) frame.contentWindow.postMessage({ giscus: { setConfig: { theme: next } } }, "https://giscus.app");
    };
    if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(apply);
    else apply();
  });
})();
</script>
<script>

document.addEventListener("click", function (e) {
  var b = e.target.closest(".code-copy");
  if (!b) return;
  var text = b.closest(".code").querySelector("pre code").innerText;
  function done() {
    b.textContent = "Copied";
    b.classList.add("done");
    setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1600);
  }
  function fallback() {
    var t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) {}
    t.remove();
    if (ok) done();
  }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
});

(function () {
  var toc = document.querySelector(".toc");
  if (!toc) return;
  var links = {}, current = null;
  toc.querySelectorAll("a[href^='#']").forEach(function (a) { links[decodeURIComponent(a.hash.slice(1))] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting || !links[e.target.id]) return;
      if (current) current.removeAttribute("aria-current");
      current = links[e.target.id];
      current.setAttribute("aria-current", "true");
    });
  }, { rootMargin: "0px 0px -70% 0px" });
  document.querySelectorAll(".prose h2[id], .prose h3[id]").forEach(function (h) { io.observe(h); });
})();
</script>
