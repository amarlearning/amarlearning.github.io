{{ define "main" }}
<div class="intro">
    {{ .Content }}
</div>

<section class="block" aria-label="Projects">
    <div class="entries">
    {{ range .Site.Data.projects }}
        <article class="entry">
            <div class="entry-head">
                <h3 class="entry-title">{{ .title }}</h3>
                <span class="entry-links">
                    {{ range .links }}<a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .name }} {{ partial "icon-arrow.html" . }}</a>{{ end }}
                </span>
            </div>
            <p class="entry-desc">{{ .description }}</p>
        </article>
    {{ end }}
    </div>
</section>

<section class="block" aria-labelledby="oss">
    <h2 class="block-head" id="oss">Open source</h2>
    <div class="entries">
    {{ range .Site.Data.oss }}
        <a class="entry" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
            <span class="entry-head">
                <span class="entry-title">{{ .organization }}</span>
                <span class="entry-links">{{ .role }}</span>
            </span>
            <span class="entry-desc">{{ .description }}</span>
        </a>
    {{ end }}
    </div>
</section>
{{ end }}
