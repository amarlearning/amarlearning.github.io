{{ define "main" }}
<div class="intro">
    {{ .Content }}
</div>

<hr>

<section class="home-section">
    <p class="section-label">Projects</p>
    {{ range .Site.Data.projects }}
    <article class="entry">
        <div class="entry-head">
            <span class="work-icon" aria-hidden="true">{{ .icon }}</span>
            <h2 class="entry-title">{{ .title }}</h2>
            <span class="entry-links">
                {{ range .links }}<a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .name }} ↗</a>{{ end }}
            </span>
        </div>
        <p class="entry-desc">{{ .description }}</p>
    </article>
    {{ end }}
</section>

<hr>

<section class="home-section">
    <p class="section-label">Open source</p>
    {{ range .Site.Data.oss }}
    <a class="entry" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
        <span class="entry-head">
            <span class="entry-title">{{ .organization }}</span>
            <span class="entry-links">{{ .role }}</span>
        </span>
        <span class="entry-desc">{{ .description }}</span>
    </a>
    {{ end }}
</section>
{{ end }}
