{{ define "main" }}
<div class="intro">
    {{ .Content }}
</div>

<section class="block" aria-labelledby="talks">
    <h2 class="block-head" id="talks">Engineering Talks</h2>
    <div class="rows">
    {{ range .Site.Data.talks }}
        <a class="row" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
            <span class="row-title">{{ .title }}<span class="row-sub">{{ .speaker }}</span></span>
            <span class="row-meta">{{ .duration }}</span>
        </a>
    {{ end }}
    </div>
</section>
{{ end }}
