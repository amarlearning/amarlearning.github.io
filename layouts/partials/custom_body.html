<script>
(function () {
  var root = document.documentElement;
  var button = document.querySelector(".theme-toggle");
  if (!button) return;
  function current() {
    return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function sync() { button.setAttribute("aria-pressed", current() === "dark"); }
  sync();
  button.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    var apply = function () {
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      sync();
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame) frame.contentWindow.postMessage({ giscus: { setConfig: { theme: next } } }, "https://giscus.app");
    };
    if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(apply);
    else apply();
  });
})();
</script>
<script>
// code blocks: copy the code, say so for a moment (falls back to a selection copy where the clipboard API is refused)
document.addEventListener("click", function (e) {
  var b = e.target.closest(".code-copy");
  if (!b) return;
  var text = b.closest(".code").querySelector("pre code").innerText;
  function done() {
    b.textContent = "Copied";
    b.classList.add("done");
    setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1600);
  }
  function fallback() {
    var t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) {}
    t.remove();
    if (ok) done();
  }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
});
// on this page: mark the section you're reading
(function () {
  var toc = document.querySelector(".toc");
  if (!toc) return;
  var links = {}, current = null;
  toc.querySelectorAll("a[href^='#']").forEach(function (a) { links[decodeURIComponent(a.hash.slice(1))] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting || !links[e.target.id]) return;
      if (current) current.removeAttribute("aria-current");
      current = links[e.target.id];
      current.setAttribute("aria-current", "true");
    });
  }, { rootMargin: "0px 0px -70% 0px" });
  document.querySelectorAll(".prose h2[id], .prose h3[id]").forEach(function (h) { io.observe(h); });
})();
</script>
<script>
// post images: click (or Enter) opens the full-size image in a dialog; click anywhere or Esc closes it
(function () {
  var imgs = document.querySelectorAll(".prose.post img");
  if (!imgs.length) return;
  var box = document.createElement("dialog"), big = document.createElement("img");
  box.className = "lightbox";
  box.setAttribute("aria-label", "Image");
  box.innerHTML = '<button class="lightbox-close" type="button" aria-label="Close">&times;</button>';
  box.appendChild(big);
  document.body.appendChild(box);
  box.addEventListener("click", function () { box.close(); });
  imgs.forEach(function (img) {
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    function open() { big.src = img.currentSrc || img.src; big.alt = img.alt; box.showModal(); }
    img.addEventListener("click", open);
    img.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
})();
</script>
<script>
// footer garland: leaves and blooms along a vine, drawn as ASCII and swaying in a slow wind (one still frame for reduced motion)
(function () {
  var pre = document.querySelector(".footer-art");
  if (!pre) return;
  var W = 200, H = 30, AX = 0.6;           // cells; a cell is 0.6 wide for every 1 tall, so geometry runs in "physical" units
  var PW = W * AX, RAMP = ".:-=+*x%#@";
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function vine(px) { return 18 + 3.2 * Math.sin(px * 0.075) + 1.4 * Math.sin(px * 0.21 + 1); }
  function taper(px) { return Math.pow(Math.sin(Math.PI * Math.min(Math.max(px / PW, 0), 1)), 0.6); }
  var leaves = [], blooms = [], noise = [];
  function leaf(px, up, t) { leaves.push({ x: px, a: up ? -(0.3 + rnd() * 1.0) : 0.25 + rnd() * 0.9, L: (4 + rnd() * 6) * t + 1.5, w: (1.2 + rnd() * 1.3) * t + 0.5, flip: rnd() < 0.3 }); }
  for (var px = 2; px < PW - 2; px += 1.2 + rnd() * 1.4) {
    var t = taper(px);
    if (rnd() < 0.12) continue;            // gaps keep it from reading as a hedge
    leaf(px, rnd() < 0.55, t);
    if (rnd() < 0.45) leaf(px + rnd(), rnd() < 0.5, t);
    if (rnd() < 0.2 && t > 0.35) blooms.push({ x: px + rnd() * 2, dy: -2 - rnd() * 4, r: 1.2 + rnd() * 1.4 });
  }
  for (var i = 0; i < W * H; i++) noise.push(rnd());
  var val = new Float32Array(W * H), kind = new Uint8Array(W * H);

  function frame(time) {
    val.fill(0); kind.fill(0);
    leaves.forEach(function (lf) {
      var bx = lf.x, by = vine(bx), a = lf.a + 0.14 * Math.sin(time * 0.0011 - bx * 0.09);
      if (lf.flip) a = Math.PI - a;
      var dx = Math.cos(a), dy = Math.sin(a), ex = bx + dx * lf.L, ey = by + dy * lf.L, pad = lf.w + 1;
      var c0 = Math.max(0, Math.floor((Math.min(bx, ex) - pad) / AX)), c1 = Math.min(W - 1, Math.ceil((Math.max(bx, ex) + pad) / AX));
      var r0 = Math.max(0, Math.floor(Math.min(by, ey) - pad)), r1 = Math.min(H - 1, Math.ceil(Math.max(by, ey) + pad));
      for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
        var qx = c * AX - bx, qy = r - by, u = (qx * dx + qy * dy) / lf.L;
        if (u <= 0 || u >= 1) continue;
        var half = lf.w * Math.pow(Math.sin(Math.PI * u), 0.8), v = 1 - Math.abs(qx * dy - qy * dx) / half, k = r * W + c;
        if (v > val[k]) { val[k] = v; kind[k] = 1; }
      }
    });
    blooms.forEach(function (b, n) {
      var bx = b.x + 0.4 * Math.sin(time * 0.0013 + n), by = vine(b.x) + b.dy;
      for (var r = Math.floor(by - b.r - 1); r <= by + b.r + 1; r++) for (var c = Math.floor((bx - b.r - 1) / AX); c <= (bx + b.r + 1) / AX; c++) {
        if (r < 0 || r >= H || c < 0 || c >= W) continue;
        var v = 1 - Math.hypot(c * AX - bx, r - by) / b.r, k = r * W + c;
        if (v > 0) { val[k] = Math.max(v, 0.35); kind[k] = 2; }
      }
    });
    for (var c = 0; c < W; c++) {        // the vine itself, wherever no leaf covers it
      var y = vine(c * AX), r = Math.round(y), k = r * W + c, s = vine(c * AX + AX) - y;
      if (taper(c * AX) > 0.15 && !kind[k]) { kind[k] = 3; val[k] = s > 0.25 ? 0.1 : s < -0.25 ? 0.2 : 0.3; }
    }
    var out = "";
    for (var r = 0; r < H; r++) {
      var cls = "", run = "";
      for (var c = 0; c < W; c++) {
        var k = r * W + c, v = val[k], n = noise[k], ch = " ", cl = "";
        if (kind[k] === 3) { ch = v < 0.15 ? "\\" : v < 0.25 ? "/" : "~"; cl = "st"; }
        else if (kind[k] && v > n * 0.3) {
          ch = RAMP[Math.min(RAMP.length - 1, Math.floor((v * 0.8 + n * 0.3) * RAMP.length))];
          cl = kind[k] === 2 ? (v > 0.45 ? "b2" : "b1") : v > 0.6 ? "l3" : v > 0.3 ? "l2" : "l1";
        }
        if (cl !== cls) { out += cls ? '<span class="' + cls + '">' + run + "</span>" : run; cls = cl; run = ""; }
        run += ch;
      }
      out += (cls ? '<span class="' + cls + '">' + run + "</span>" : run) + "\n";
    }
    pre.innerHTML = out;
  }

  frame(0);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var on = false, last = 0;
  function loop(t) { if (!on) return; if (t - last > 90) { last = t; frame(t); } requestAnimationFrame(loop); }
  new IntersectionObserver(function (e) { var was = on; on = e[0].isIntersecting; if (on && !was) requestAnimationFrame(loop); }).observe(pre);
})();
</script>
<script>
// the bee: drifts to a random spot near where you're reading, hovers a moment, picks another; turns to face where it's going
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var bee = document.createElement("div");
  bee.className = "bee"; bee.setAttribute("aria-hidden", "true");
  bee.innerHTML = '<div class="bee-model"><i class="side r"></i><i class="side l"></i><i class="top"></i><i class="bottom"></i><i class="front"></i><i class="back"></i><i class="ant r"></i><i class="ant l"></i><i class="wing r"></i><i class="wing l"></i></div>';
  document.body.appendChild(bee);
  var model = bee.firstChild, W = function () { return document.documentElement.clientWidth; };
  var x = W() * 0.85, y = scrollY + innerHeight * 0.75, vx = 0, vy = 0, tx = x, ty = y, rest = 1, yaw = -30, last = performance.now();
  function pick() { tx = 30 + Math.random() * (W() - 60); ty = scrollY + 50 + Math.random() * (innerHeight - 100); }
  function step(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (Math.abs(y - (scrollY + innerHeight / 2)) > innerHeight * 0.8 && rest > 0.3) rest = 0.3;   // you scrolled away: come along
    if (rest > 0) { rest -= dt; vx *= 0.92; vy *= 0.92; if (rest <= 0) pick(); }
    else {
      var dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy), k = Math.min(1, dt * 2.2), sp = Math.min(110, 40 + d);
      if (d < 10) rest = 0.6 + Math.random() * 2.4;
      else { vx += (dx / d * sp - vx) * k; vy += (dy / d * sp - vy) * k; }
    }
    x += vx * dt; y += vy * dt;
    if (Math.abs(vx) > 6) yaw += ((vx > 0 ? -30 : -150) - yaw) * Math.min(1, dt * 4);   // right: -30°, left: -150°, turning through facing you
    bee.style.transform = "translate3d(" + x.toFixed(1) + "px," + (y + Math.sin(now / 170) * 3).toFixed(1) + "px,0)";
    model.style.transform = "rotateX(-20deg) rotateY(" + yaw.toFixed(1) + "deg) rotateZ(" + (-vy * 0.08).toFixed(1) + "deg)";
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
<script>
// a soft tick on every click, made in the browser (no audio file)
(function () {
  var ctx;
  document.addEventListener("pointerdown", function (e) {
    if (e.button) return;
    try { ctx = ctx || new AudioContext(); } catch (err) { return; }
    var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(400, t + 0.045);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.07);
  }, { passive: true });
})();
</script>
