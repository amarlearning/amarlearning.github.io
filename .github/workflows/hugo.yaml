name: Hugo CI

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # share cards and the résumé image are generated, not committed (Chrome is preinstalled on the runner)
      - name: Render images
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick poppler-utils webp
          python3 assets/render-images.py

      - name: Build with Hugo
        run: hugo

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: 'amarpandey.me'
